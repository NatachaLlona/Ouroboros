services:
  api:
    profiles: [api]
    depends_on:
      postgresql:
        condition: service_healthy
    build:
      context: ../..
      dockerfile: modules/api/Service.Dockerfile
    ports:
      - "127.0.0.1:${API_HOST_PORT:-6969}:8000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ../api/config.jsonc:/runtime/modules/api/config.jsonc:ro
      - ../../provisioning.jsonc:/runtime/provisioning.jsonc:ro
    secrets: [api_sql_password, api_token_signing_key, api_tls_certificate, api_tls_private_key]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,ssl; from api.service.config import load; s=load(); c=ssl.create_default_context(cafile='/run/secrets/api_tls_certificate'); c.verify_flags |= ssl.VERIFY_X509_PARTIAL_CHAIN; t=c.wrap_socket(socket.create_connection(('127.0.0.1',8000),5),server_hostname=s['tls']['server_name']); t.sendall(('GET /health HTTP/1.1\\r\\nHost: '+s['tls']['server_name']+'\\r\\nConnection: close\\r\\n\\r\\n').encode()); assert t.recv(4096).startswith(b'HTTP/1.1 200'); t.close()"]
      interval: 2s
      timeout: 5s
      retries: 30
secrets:
  api_tls_certificate:
    file: ${API_TLS_CERTIFICATE:-../../.secrets/api-local.pem}
  api_tls_private_key:
    file: ${API_TLS_PRIVATE_KEY:-../../.secrets/api-local-key.pem}
  api_sql_password:
    file: ${API_SQL_SECRET:-../../.secrets/api_sql_password}
  api_token_signing_key:
    file: ${API_SIGNING_SECRET:-../../.secrets/api_token_signing_key}
