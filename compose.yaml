services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${OUROBOROS_DB_NAME:?Run python start.py first}
      POSTGRES_USER: ${OUROBOROS_DB_USER:?Run python start.py first}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${OUROBOROS_DB_PORT:-6669}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
secrets:
  postgres_password:
    file: ${OUROBOROS_DB_SECRET_FILE:?Run python start.py first}
volumes:
  postgres_data:
