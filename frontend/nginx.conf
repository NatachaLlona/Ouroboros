map $request_uri $frontend_csp {
    default "";
    ~^/(?:$|frontend/|cadastros(?:\?|$)|consultas(?:\?|$)|cadastrar(?:\?|$)|consultar(?:\?|$)) "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}
map $request_uri $frontend_cache {
    default "";
    "~^/frontend/.*-[A-Za-z0-9_-]{8,}\.(?:js|css)(?:\?|$)" "public, max-age=31536000, immutable";
    ~^/frontend/ no-store;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend http://${OUROBOROS_API_UPSTREAM};
    access_log off;
    client_max_body_size 256m;
    client_body_timeout 600s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $frontend_csp always;
    add_header Cache-Control $frontend_cache always;

    location = /frontend-health { return 200 'ok'; }
    location /frontend/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location = / { rewrite ^ /frontend/index.html last; }
    location = /cadastrar { rewrite ^ /frontend/index.html last; }
    location = /consultar { rewrite ^ /frontend/index.html last; }
    location = /_page_access {
        internal;
        proxy_pass $api_backend/browser/page-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Protected page requests first execute the API's existing session/role check.
    location ~ ^/(?<registration_destination>cadastros|consultas)$ {
        auth_request /_page_access;
        error_page 401 = @login;
        error_page 403 =403 /frontend/index.html;
        root /usr/share/nginx/html/frontend;
        try_files /index.html =404;
    }
    location @login { return 303 /?entrar=1&destino=$registration_destination; }
    location / {
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 8400s;
        proxy_send_timeout 8400s;
    }
}
