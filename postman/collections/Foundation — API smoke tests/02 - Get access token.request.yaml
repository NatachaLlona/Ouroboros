$kind: http-request
url: "{{base_url}}/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    username: "{{api_username}}"
    password: "{{api_password}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Request interaction ID", () => pm.expect(pm.response.headers.get("X-Interaction-ID")).to.match(/^[0-9]{24}$/));
      if (pm.response.code === 200) {
        const data = pm.response.json();
        pm.test("Access token returned", () => pm.expect(data.access_token).to.be.a("string").and.not.empty);
        pm.collectionVariables.set("access_token", data.access_token);
      } else { pm.collectionVariables.set("access_token", ""); }
    language: text/javascript
order: 2000
