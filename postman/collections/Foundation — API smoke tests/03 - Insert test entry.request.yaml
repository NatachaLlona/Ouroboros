$kind: http-request
url: "{{base_url}}/test"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "value": "Ouroboros está vivo! 🐍💻"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.test("Request interaction ID", () => pm.expect(pm.response.headers.get("X-Interaction-ID")).to.match(/^[0-9]{24}$/));
      if (pm.response.code === 201) { pm.collectionVariables.set("test_id", String(pm.response.json().id)); }
      else { pm.collectionVariables.set("test_id", ""); }
    language: text/javascript
order: 3000
